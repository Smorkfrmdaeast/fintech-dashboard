<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMORK'S PAYDOM</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body { background: linear-gradient(120deg,#0b0f1a,#131625); color:white; font-family:system-ui; overflow-x:hidden;}
.glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(14px); border:1px solid rgba(255,255,255,0.12); transition:.3s;}
.carousel { overflow:hidden; border-radius:1rem; margin-bottom:1rem;}
.carousel-inner { display:flex; transition:transform .7s ease;}
.carousel-item { min-width:100%; padding:1.5rem; text-align:center; font-weight:600;}
.toast { position:fixed; bottom:20px; right:20px; background:#111; padding:14px; border-radius:10px; opacity:0; transition:.3s;}
</style>
</head>

<body class="p-4">

<script>
if(localStorage.getItem("loggedIn")!=="true"){location.href="login.html";}
</script>

<!-- HEADER -->
<div class="flex justify-between mb-4">
  <h1 class="font-bold text-xl">💳 SMORK'S PAYDOM</h1>
  <button onclick="logout()" class="text-red-400">Logout</button>
</div>

<!-- PROFILE -->
<div class="flex items-center gap-3 mb-4">
  <div class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center text-black font-bold">S</div>
  <div>
    <p class="text-sm text-gray-400">Welcome</p>
    <p class="font-semibold">SMORK</p>
  </div>
</div>

<!-- CAROUSEL -->
<div class="carousel glass">
  <div id="carouselInner" class="carousel-inner">
    <div class="carousel-item bg-yellow-400 text-black">🎉 Welcome to SMORK'S PAYDOM</div>
    <div class="carousel-item bg-blue-500">⚡ Pay bills instantly</div>
    <div class="carousel-item bg-purple-500">💳 Smooth bank transfers</div>
  </div>
</div>

<!-- WALLET -->
<div class="glass p-6 rounded-xl mb-4">
  <p class="text-gray-400">Balance</p>
  <div class="flex justify-between items-center">
    <h2 id="balance" class="text-3xl font-bold"></h2>
    <button onclick="toggleBalance()"><i id="eyeIcon" class="fas fa-eye"></i></button>
  </div>

  <p class="text-gray-400 mt-2 text-sm">Account Number</p>
  <div class="flex justify-between">
    <span id="acctNumber"></span>
    <button onclick="copyAcct()" class="text-yellow-400 text-sm">Copy</button>
  </div>
</div>

<!-- ACTIONS -->
<div class="grid grid-cols-3 gap-3 mb-4">
  <button onclick="openPayment('Bank')" class="glass p-3 rounded">Bank</button>
  <button onclick="openPayment('Airtime')" class="glass p-3 rounded">Airtime</button>
  <button onclick="openPayment('TV')" class="glass p-3 rounded">TV</button>
  <button onclick="openPayment('Electricity')" class="glass p-3 rounded">Electricity</button>
  <button onclick="openPayment('Internet')" class="glass p-3 rounded">Internet</button>
  <button onclick="openPayment('Data')" class="glass p-3 rounded">Data</button>
</div>

<!-- TX -->
<div class="glass p-4 rounded-xl">
  <h3>Transactions</h3>
  <div id="txList"></div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
  <div class="glass p-6 rounded-xl w-80">
    <h3 id="title"></h3>
    <select id="provider" class="w-full p-2 text-black rounded mt-2"></select>
    <input id="account" placeholder="Account" class="w-full p-2 text-black rounded mt-2"/>
    <p id="acctName" class="hidden text-green-400 text-sm">Verified User</p>
    <input id="amount" type="number" placeholder="Amount" class="w-full p-2 text-black rounded mt-2"/>
    <button onclick="pay()" class="bg-yellow-400 w-full p-2 mt-2 rounded">Pay</button>
    <button onclick="closeModal()" class="mt-2 text-gray-400">Cancel</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// STATE
const state={
 balance:120000,
 visible:true,
 tx:JSON.parse(localStorage.getItem("tx"))||[]
};

// ACCOUNT NUMBER
if(!localStorage.getItem("acctNum")){
 localStorage.setItem("acctNum",Math.floor(1000000000+Math.random()*9000000000));
}
acctNumber.innerText=localStorage.getItem("acctNum");

// UI
function updateUI(){
 balance.innerText=state.visible?"₦"+state.balance:"****";
 renderTx();
}

// TOGGLE
function toggleBalance(){
 state.visible=!state.visible;
 eyeIcon.className=state.visible?"fas fa-eye":"fas fa-eye-slash";
 updateUI();
}

// LOGOUT
function logout(){localStorage.removeItem("loggedIn");location.href="login.html";}

// COPY
function copyAcct(){
 navigator.clipboard.writeText(localStorage.getItem("acctNum"));
 toast("Copied ✅");
}

// CAROUSEL
let i=0;
setInterval(()=>{
 const c=document.getElementById("carouselInner");
 i=(i+1)%3;
 c.style.transform=`translateX(-${i*100}%)`;
},4000);

// PROVIDERS
const providers={
 Bank:["Access","GTB","Zenith"],
 Airtime:["MTN","Airtel"],
 TV:["DSTV"],
 Electricity:["IKEDC"],
 Internet:["Smile"],
 Data:["MTN Data"]
};

// OPEN MODAL
function openPayment(type){
 modal.classList.remove("hidden");
 title.innerText=type;
 provider.innerHTML="";
 providers[type].forEach(p=>provider.innerHTML+=`<option>${p}</option>`);
}

// CLOSE
function closeModal(){modal.classList.add("hidden");}

// FAKE NAME VERIFY
account.addEventListener("input",()=>{
 acctName.classList.toggle("hidden",account.value.length<10);
});

// PAY
function pay(){
 const amt=Number(amount.value);
 if(!amt||amt>state.balance)return alert("Invalid");
 state.balance-=amt;
 state.tx.unshift({amt:-amt,type:"Payment"});
 localStorage.setItem("tx",JSON.stringify(state.tx));
 updateUI();
 closeModal();
 toast("Done ✅");
}

// RENDER TX
function renderTx(){
 txList.innerHTML="";
 state.tx.slice(0,5).forEach(t=>{
 txList.innerHTML+=`<div class="flex justify-between">
 <span>${t.type}</span>
 <span>${t.amt}</span></div>`;
 });
}

// TOAST
function toast(msg){
 const t=toastEl=document.getElementById("toast");
 t.innerText=msg;
 t.style.opacity=1;
 setTimeout(()=>t.style.opacity=0,2000);
}

updateUI();
</script>

</body>
</html>
